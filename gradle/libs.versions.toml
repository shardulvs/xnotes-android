[versions]
agp = "8.12.3"
kotlin = "2.2.21"
coreKtx = "1.16.0"
lifecycle = "2.9.4"
activityCompose = "1.10.1"
composeBom = "2026.05.01"
coroutines = "1.10.2"
junit = "4.13.2"
json = "20240303"
pdfboxAndroid = "2.0.27.0"
androidsvg = "1.4"
argon2kt = "1.6.0"
work = "2.9.1"
mlkitDigitalInk = "18.1.0"
commonmark = "0.30.0"
kxml2 = "2.3.0"
latex = "1.5.0-kt2.1.0"
